<title>Prospetto Lotti FAB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --carta:#E9EDF2; --foglio:#FFFFFF; --foglio-2:#F4F6F9;
  --inchiostro:#111821; --inchiostro-2:#576470; --inchiostro-3:#8894A1;
  --tratto:#C9D2DC; --tratto-tenue:#DFE5EC;
  --accento:#1B4F7C; --accento-tenue:#E3ECF4;
  --buono:#0CA30C; --medio:#FAB219; --critico:#D03B3B;
  --buono-testo:#0A6B1F; --medio-testo:#7A5502; --critico-testo:#9A2620;
  --buono-fondo:#E6F4E6; --medio-fondo:#FCF2DC; --critico-fondo:#FAE7E6;
  --ombra:0 1px 2px rgba(17,24,33,.06), 0 8px 24px rgba(17,24,33,.07);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --carta:#0E1318; --foglio:#161C23; --foglio-2:#1C242C;
    --inchiostro:#E2E8EF; --inchiostro-2:#98A5B3; --inchiostro-3:#6E7C8A;
    --tratto:#2A333D; --tratto-tenue:#212932;
    --accento:#79B0DC; --accento-tenue:#1A2833;
    --buono:#3FBF87; --medio:#E8B93C; --critico:#E85D5D;
    --buono-testo:#5FD2A0; --medio-testo:#F0C960; --critico-testo:#F08A8A;
    --buono-fondo:#12291F; --medio-fondo:#2B2313; --critico-fondo:#2E1918;
    --ombra:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --carta:#0E1318; --foglio:#161C23; --foglio-2:#1C242C;
  --inchiostro:#E2E8EF; --inchiostro-2:#98A5B3; --inchiostro-3:#6E7C8A;
  --tratto:#2A333D; --tratto-tenue:#212932;
  --accento:#79B0DC; --accento-tenue:#1A2833;
  --buono:#3FBF87; --medio:#E8B93C; --critico:#E85D5D;
  --buono-testo:#5FD2A0; --medio-testo:#F0C960; --critico-testo:#F08A8A;
  --buono-fondo:#12291F; --medio-fondo:#2B2313; --critico-fondo:#2E1918;
  --ombra:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
body{margin:0;background:var(--carta);color:var(--inchiostro);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accento);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.occhiello{font-family:var(--serif);font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--inchiostro-3)}

/* ---------------------------------------------------------- testata */
.testata{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 22px;background:var(--foglio);border-bottom:1px solid var(--tratto);position:sticky;top:0;z-index:40}
.marchio{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:9px}
.marchio em{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;color:var(--inchiostro-3);border:1px solid var(--tratto);padding:2px 6px;border-radius:3px}
.testata .flex{flex:1}
.campo{display:flex;flex-direction:column;gap:3px}
.campo>span{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--inchiostro-3);font-weight:500}
select,input[type=search],input[type=number],input[type=text]{background:var(--foglio-2);border:1px solid var(--tratto);border-radius:5px;padding:6px 9px;min-width:0}
input[type=number],input[type=search]{font-family:var(--mono)}

.btn{background:var(--foglio-2);border:1px solid var(--tratto);border-radius:5px;padding:7px 13px;cursor:pointer;white-space:nowrap;font-weight:500;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--accento);background:var(--accento-tenue)}
.btn.primario{background:var(--accento);border-color:var(--accento);color:var(--foglio);font-weight:600}
:root:not([data-theme="dark"]) .btn.primario{color:#fff}
.btn.primario:hover{filter:brightness(1.12)}
.btn.mini{padding:4px 9px;font-size:12px}

/* ------------------------------------------------- fascia di sintesi */
.sintesi{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));background:var(--foglio);border-bottom:1px solid var(--tratto)}
.sintesi>div{padding:13px 22px;border-right:1px solid var(--tratto-tenue)}
.sintesi>div:last-child{border-right:0}
.sintesi .etichetta{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--inchiostro-3);font-weight:500}
.sintesi .cifra{font-family:var(--mono);font-size:21px;font-weight:500;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.sintesi .glossa{font-size:11.5px;color:var(--inchiostro-2);margin-top:1px}
.cifra.pos{color:var(--buono-testo)} .cifra.neg{color:var(--critico-testo)}

.stati{display:flex;gap:5px;margin-top:6px}
.stati button{flex:1;border:1px solid transparent;border-radius:4px;padding:5px 3px;cursor:pointer;font-family:var(--mono);font-weight:600;font-size:15px;line-height:1.15;text-align:center}
.stati button small{display:block;font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;opacity:.85}
.stati .s-verde{background:var(--buono-fondo);color:var(--buono-testo)}
.stati .s-giallo{background:var(--medio-fondo);color:var(--medio-testo)}
.stati .s-rosso{background:var(--critico-fondo);color:var(--critico-testo)}
.stati button[aria-pressed=true]{border-color:currentColor}

/* -------------------------------------------------------- scaletta */
.scaletta{background:var(--foglio);border-bottom:1px solid var(--tratto);padding:14px 22px 18px;display:grid;grid-template-columns:minmax(300px,58ch) minmax(300px,430px);gap:40px;align-items:center;justify-content:start}
.scaletta .testo{font-size:12.5px;color:var(--inchiostro-2);line-height:1.55;max-width:62ch}
.scaletta h2{font-family:var(--serif);font-size:14px;font-weight:600;margin:0 0 4px}
.scaletta svg{width:100%;height:auto;display:block;margin-top:4px}
.legenda-regola{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--inchiostro-2);margin-top:7px}
.legenda-regola i{width:22px;height:0;border-top:2px dashed var(--critico);display:inline-block}

/* ---------------------------------------------------------- filtri */
.filtri{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;padding:11px 22px;background:var(--foglio-2);border-bottom:1px solid var(--tratto)}
.filtri input[type=search]{min-width:210px}

/* --------------------------------------------------------- tabella */
.telaio{overflow-x:auto;padding:0 22px 56px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--carta);text-align:right;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--inchiostro-3);font-weight:600;padding:11px 9px;border-bottom:1px solid var(--tratto);cursor:pointer;white-space:nowrap;z-index:10;user-select:none}
thead th.sx{text-align:left}
thead th:hover{color:var(--inchiostro)}
thead th .ord{font-size:9px;color:var(--accento)}
tbody td{padding:9px;border-bottom:1px solid var(--tratto-tenue);text-align:right;white-space:nowrap;vertical-align:top}
tbody td.sx{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--foglio)}
tbody td:first-child{border-left:3px solid transparent;padding-left:11px}
tbody tr.verde td:first-child{border-left-color:var(--buono)}
tbody tr.giallo td:first-child{border-left-color:var(--medio);border-left-style:dashed}
tbody tr.rosso td:first-child{border-left-color:var(--critico);border-left-style:dotted}
.capo{font-weight:600}
.sotto{display:block;font-size:11px;color:var(--inchiostro-2);font-weight:400;margin-top:1px}
.pos{color:var(--buono-testo)} .neg{color:var(--critico-testo)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:500;border:1px solid var(--tratto);color:var(--inchiostro-2);background:var(--foglio-2)}
.chip.libero{color:var(--buono-testo);background:var(--buono-fondo);border-color:transparent}
.chip.occupato{color:var(--medio-testo);background:var(--medio-fondo);border-color:transparent}
.chip.abusivo{color:var(--critico-testo);background:var(--critico-fondo);border-color:transparent}
.chip.rifare{color:var(--medio-testo);background:var(--medio-fondo);border-color:transparent}

.bollo{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:3px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.bollo.verde{background:var(--buono-fondo);color:var(--buono-testo)}
.bollo.giallo{background:var(--medio-fondo);color:var(--medio-testo)}
.bollo.rosso{background:var(--critico-fondo);color:var(--critico-testo)}

.conf{display:inline-block;width:40px;height:4px;background:var(--tratto);border-radius:2px;overflow:hidden;vertical-align:middle}
.conf i{display:block;height:100%;background:var(--accento)}
</style>
<style>
/* ------------------------------------------------------- fascicolo */
.velo{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:50;border:0;padding:0;width:100%;cursor:default}
.fascicolo{position:fixed;top:0;right:0;bottom:0;width:min(720px,96vw);background:var(--carta);border-left:1px solid var(--tratto);box-shadow:var(--ombra);z-index:51;overflow-y:auto}
.fascicolo>header{position:sticky;top:0;background:var(--foglio);border-bottom:1px solid var(--tratto);padding:16px 22px;display:flex;align-items:flex-start;gap:13px;z-index:5}
.fascicolo h2{font-family:var(--serif);margin:0 0 3px;font-size:18px;font-weight:600}
.fascicolo .corpo{padding:18px 22px 64px;display:flex;flex-direction:column;gap:16px}

.stadio{background:var(--foglio);border:1px solid var(--tratto);border-radius:6px;overflow:hidden}
.stadio>h3{margin:0;padding:10px 16px;border-bottom:1px solid var(--tratto-tenue);background:var(--foglio-2);display:flex;align-items:baseline;gap:9px;font-size:12.5px;font-weight:600}
.stadio>h3 b{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accento);letter-spacing:.04em}
.stadio .dentro{padding:12px 16px}

.rigo{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px solid var(--tratto-tenue);align-items:baseline}
.rigo:last-child{border-bottom:0}
.rigo .voce{color:var(--inchiostro-2);font-size:13px}
.rigo .imp{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.rigo.somma{font-weight:600;border-top:1px solid var(--tratto);border-bottom:0;margin-top:4px;padding-top:9px}
.rigo.somma .voce{color:var(--inchiostro)}

.trittico{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--tratto-tenue);border:1px solid var(--tratto-tenue);border-radius:5px;overflow:hidden}
.trittico>div{background:var(--foglio);padding:11px 13px}
.trittico .etichetta{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--inchiostro-3);font-weight:500}
.trittico .cifra{font-family:var(--mono);font-size:17px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}

.duetto{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mappe{display:flex;gap:7px;flex-wrap:wrap}
.mappe a{text-decoration:none}

.nota{border-left:3px solid var(--medio);background:var(--medio-fondo);color:var(--inchiostro);padding:8px 12px;border-radius:0 4px 4px 0;font-size:12.5px;line-height:1.5}
.nota.info{border-left-color:var(--accento);background:var(--accento-tenue)}
.fonte{font-size:11.5px;color:var(--inchiostro-2);line-height:1.5}
.fonte p{margin:0 0 5px}

.scala-fab{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:7px}
.scala-fab label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--inchiostro-3);font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.scala-fab input{text-align:center}
label.riga{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--inchiostro)}

.deserto{text-align:center;padding:64px 22px;color:var(--inchiostro-2)}
.deserto h2{font-family:var(--serif);color:var(--inchiostro);font-size:19px;margin:0 0 8px}
.deserto p{max-width:56ch;margin:0 auto 12px}

.avviso-fisso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--foglio);border:1px solid var(--tratto);border-left:3px solid var(--accento);padding:11px 18px;border-radius:5px;box-shadow:var(--ombra);z-index:90;max-width:min(620px,92vw);font-size:13px}
.avviso-fisso.male{border-left-color:var(--critico)}
.avviso-fisso.bene{border-left-color:var(--buono)}

.suggerimento{position:fixed;background:var(--foglio);border:1px solid var(--tratto);border-radius:5px;box-shadow:var(--ombra);padding:8px 11px;font-size:12px;pointer-events:none;z-index:80;max-width:250px}
.suggerimento .t{font-weight:600;margin-bottom:2px}
.suggerimento .v{font-family:var(--mono);font-variant-numeric:tabular-nums}

.via{display:none!important}
@media (max-width:820px){
  .scaletta{grid-template-columns:1fr}
  .duetto,.trittico{grid-template-columns:1fr}
  .trittico>div{border-bottom:1px solid var(--tratto-tenue)}
}
</style>

<div class="testata">
  <div class="marchio">Prospetto Lotti <em>FAB</em></div>
  <input type="file" id="file" class="via" accept=".xlsx,.xlsm,.xls,.csv,.tsv,.txt">
  <button class="btn primario" id="b-carica">Carica pool</button>
  <label class="campo"><span>Detenzione</span>
    <select id="orizzonte">
      <option value="3">3 mesi</option><option value="6">6 mesi</option>
      <option value="12" selected>12 mesi</option><option value="18">18 mesi</option>
      <option value="24">24 mesi</option><option value="36">36 mesi</option>
    </select>
  </label>
  <label class="campo"><span>Prezzo di rivendita</span>
    <select id="metodo">
      <option value="file">Valore file meno sconto</option>
      <option value="mercato">Comparabili di zona</option>
      <option value="prudenziale">Il minore dei due</option>
    </select>
  </label>
  <div class="flex"></div>
  <button class="btn" id="b-ipotesi">Ipotesi</button>
  <button class="btn" id="b-fonti">Fonti</button>
  <button class="btn" id="b-csv">Esporta CSV</button>
</div>

<div class="sintesi" id="sintesi"></div>
<section class="scaletta" id="scaletta"></section>

<div class="filtri">
  <label class="campo"><span>Cerca</span><input type="search" id="f-testo" placeholder="lotto, comune, indirizzo"></label>
  <label class="campo"><span>Tipologia</span><select id="f-tipo"><option value="">Tutte</option></select></label>
  <label class="campo"><span>Provincia</span><select id="f-prov"><option value="">Tutte</option></select></label>
  <label class="campo"><span>Occupazione</span><select id="f-occ"><option value="">Tutte</option></select></label>
  <label class="campo"><span>Conservazione</span><select id="f-cons"><option value="">Tutte</option></select></label>
  <label class="campo"><span>Multiplo minimo</span><input type="number" id="f-mult" step="0.05" min="0" style="width:88px" placeholder="0"></label>
  <div class="flex" style="flex:1"></div>
  <button class="btn mini" id="b-azzera">Azzera filtri</button>
</div>

<div class="telaio">
  <table><thead><tr id="capi"></tr></thead><tbody id="corpo"></tbody></table>
  <div id="deserto" class="deserto via"></div>
</div>

<button id="velo" class="velo via" aria-label="Chiudi il pannello"></button>
<aside id="fascicolo" class="fascicolo via" role="dialog" aria-label="Scheda immobile"></aside>
<div id="sugg" class="suggerimento via" role="status"></div>

      trovata = slugs.find(([h, s]) => s && !usate.has(h) && (s.includes(a) || a.includes(s)) && Math.abs(s.length - a.length) <= 12)?.[0];
      if (trovata) break;
    }
    if (trovata) { mappa[campo] = trovata; usate.add(trovata); }
  }
  return mappa;
}

function numeroIt(v) {
  if (v == null) return null;
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  let t = String(v).trim();
  if (!t || ["na","n a","nd","n d","-","non disponibile"].includes(sfoglia(t))) return null;
  t = t.replace(/[^\d,.\-]/g, "");
  if (!t || ["-", ".", ","].includes(t)) return null;
  const virgola = t.includes(","), punto = t.includes(".");
  if (virgola && punto) t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  else if (virgola) t = /,\d{1,2}$/.test(t) ? t.replace(",", ".") : t.replace(/,/g, "");
  else if (punto && /\.\d{3}(\.\d{3})*$/.test(t)) t = t.replace(/\./g, "");
  const n = parseFloat(t);
  return Number.isFinite(n) ? n : null;
}

const RE_FAB = /\bfab(?:bricato)?\s*[-_.:n°#]*\s*(\d{1,2})\b/i;
function estraiFab(...valori) {
  for (const v of valori) {
    if (v == null) continue;
    const t = String(v).trim();
    if (!t) continue;
    const m = t.match(RE_FAB);
    if (m) { const n = +m[1]; if (n >= 1 && n <= 10) return n; }
    if (/^\d{1,2}([.,]0+)?$/.test(t)) { const n = Math.trunc(parseFloat(t.replace(",", "."))); if (n >= 1 && n <= 10) return n; }
  }
  return null;
}

function risolviGeografia(comune, provincia) {
  comune = (comune || "").trim();
  let sigla = (provincia || "").trim().toUpperCase();
  if (sigla && !D.province[sigla]) {
    const atteso = sfoglia(sigla);
    sigla = Object.entries(D.province).find(([, [nome]]) => sfoglia(nome) === atteso)?.[0] || "";
  }
  if (!sigla && comune) {
    sigla = COMUNI_NOTI[sfoglia(comune).toUpperCase()] || "";
    if (!sigla) sigla = Object.entries(D.province).find(([, [nome]]) => sfoglia(nome) === sfoglia(comune))?.[0] || "";
  }
  let regione = "";
  if (D.province[sigla]) { if (!comune) comune = D.province[sigla][0]; regione = D.province[sigla][1]; }
  return { comune, provincia: sigla, regione };
}

/* ================================= motore ================================= */

const CHIAVE_COSTI = { residenziale:"residenziale", ufficio:"ufficio", ricettivo:"ricettivo",
  capannone:"capannone", commerciale:"commerciale", box:"box", terreno:"terreno", altro:"residenziale" };
const chiave = (i) => CHIAVE_COSTI[i.tipologia] || "residenziale";
const eTerreno = (i) => i.tipologia === "terreno";

function percentualeAcquisto(i, ip) {
  const s = ip.fab.scala;
  return i.fab != null && s[i.fab] != null ? s[i.fab] : ip.fab.percentuale_se_fab_assente;
}

function notaio(prezzo, ip) {
  const a = ip.acquisto;
  let onorario = null;
  for (const [soglia, importo] of a.notaio_scaglioni) if (prezzo <= soglia) { onorario = importo; break; }
  if (onorario == null) {
    const [s, imp] = a.notaio_scaglioni[a.notaio_scaglioni.length - 1];
    onorario = imp + (prezzo - s) * a.notaio_pct_oltre_ultimo_scaglione;
  }
  return onorario * (1 + a.notaio_iva_pct) + a.notaio_spese_accessorie;
}

function costiAcquisto(prezzoAcq, ip, prezzoBase) {
  const a = ip.acquisto;
  const intermediazione = (prezzoBase || prezzoAcq) * (a.intermediazione_pct || 0);
  const registro = Math.max(prezzoAcq * a.imposta_registro_pct, a.imposta_registro_minima);
  const fisse = a.imposta_ipotecaria_fissa + a.imposta_catastale_fissa;
  const par = notaio(prezzoAcq, ip);
  const agenzia = Math.max(prezzoAcq * a.commissione_agenzia_acquisto_pct, a.commissione_agenzia_acquisto_minima);
  const altri = a.due_diligence_fissa + a.perizia_fissa + a.visure_volture_fissa;
  return { intermediazione, registro, fisse, notaio: par, agenzia, altri,
    totale: intermediazione + registro + fisse + par + agenzia + altri };
}

function aliquotaImu(i) {
  const c = (i.comune || "").trim().toUpperCase();
  if (D.imu.aliqComune[c] != null) return D.imu.aliqComune[c];
  return D.imu.aliqRegione[i.regione] ?? D.imu.aliqRegione._default;
}

function moltiplicatoreCatastale(categoria, tipologia) {
  const m = D.imu.molt, cat = (categoria || "").toUpperCase().replace(/\s/g, "");
  if (m[cat] != null) return m[cat];
  if (cat.startsWith("A/10")) return m["A/10"];
  if (cat.startsWith("D/5")) return m["D/5"];
  const primo = cat[0];
  if ("ABCD".includes(primo)) {
    const pref = primo === "C" && cat.length >= 3 ? cat.slice(0, 3) : primo;
    return m[pref] ?? m[primo] ?? 160;
  }
  return ({ ufficio: 80, capannone: 65, commerciale: 55, box: 160 })[tipologia] ?? 160;
}

function fasciaRendita(comune) {
  const c = (comune || "").trim().toUpperCase();
  if (D.imu.renditaComuniA.includes(c)) return "fascia_A";
  if (D.imu.renditaComuniB.includes(c)) return "fascia_B";
  return "fascia_C";
}

function imuAnnua(i, valoreMercato) {
  const aliquota = aliquotaImu(i);
  if (eTerreno(i)) {
    const t = D.imu.terreni, mq = i.superficie_mq || 0;
    if (i.destinazione_terreno === "edificabile")
      return { importo: (valoreMercato || 0) * t.aliquota_edificabile, metodo: "terreno edificabile: aliquota sul valore venale" };
    const reddito = mq * t.reddito_dominicale_stimato_eur_mq;
    const base = reddito * D.imu.rivDominicale * D.imu.molt.terreno_agricolo;
    return { importo: base * t.aliquota_agricolo, metodo: "terreno agricolo: reddito dominicale stimato (esente per CD/IAP e comuni montani)" };
  }
  const molt = moltiplicatoreCatastale(i.categoria_catastale, i.tipologia);
  let rendita, metodo;
  if (i.rendita_catastale > 0) { rendita = i.rendita_catastale; metodo = "rendita catastale da file (calcolo esatto)"; }
  else {
    const f = fasciaRendita(i.comune), tab = D.imu.rendita[f];
    const eurMq = tab[chiave(i)] ?? tab.residenziale;
    rendita = (i.superficie_mq || 0) * eurMq;
    metodo = `rendita stimata (${f.replace("_", " ")}, ${eurMq} €/mq)`;
  }
  return { importo: rendita * D.imu.rivRendita * molt * aliquota, metodo };
}

function oneriAnnui(i, ip) {
  const voci = D.imu.oneri[chiave(i)] || D.imu.oneri.residenziale;
  const fattore = D.imu.moltOneri[i.regione] ?? D.imu.moltOneri._default;
  const mq = i.superficie_mq || 0;
  const occupato = ["occupato", "parzialmente_occupato", "occupato_senza_titolo"].includes(i.stato_occupazione);
  const out = {};
  for (const [voce, eurMq] of Object.entries(voci)) {
    let importo = mq * eurMq * fattore;
    if (voce === "tari" && !occupato && !ip.mantenimento.applica_tari_se_libero) importo = 0;
    if (voce === "utenze_vuoto" && occupato) importo = 0;
    out[voce] = importo;
  }
  return out;
}

function capexRistrutturazione(i) {
  const tab = D.imu.capex[chiave(i)] || D.imu.capex.residenziale;
  const stato = i.stato_conservazione && i.stato_conservazione !== "sconosciuto" ? i.stato_conservazione : "buono";
  return (i.superficie_mq || 0) * (tab[stato] ?? 0);
}

/* ---------------------------- comparabili di zona ---------------------------- */

const FINESTRE = { m3: 0.125, m6: 0.25, m12: 0.5 };
const ETICHETTE = { m3: "Ultimi 3 mesi", m6: "Ultimi 6 mesi", m12: "Ultimi 12 mesi" };
const serieStorica = (base, trend) =>
  Object.fromEntries(Object.entries(FINESTRE).map(([k, anni]) => [k, base / (1 + trend) ** anni]));

function comparabile(i) {
  const note = [];
  const res = D.mercato.res;
  const prov = res[i.provincia] != null ? i.provincia : "";
  let residenziale, affidabilita, zona;
  if (prov) {
    residenziale = res[prov]; affidabilita = "media"; zona = `${i.comune || prov} (${prov})`;
  } else {
    const v = Object.values(res);
    residenziale = v.reduce((a, b) => a + b, 0) / v.length;
    affidabilita = "bassa"; zona = "media nazionale";
    note.push("Provincia non riconosciuta: applicata la media nazionale.");
  }

  let base, etichetta;
  if (eTerreno(i)) {
    const t = D.mercato.terreni, dest = i.destinazione_terreno;
    if (dest === "edificabile" || dest === "industriale") {
      const ind = dest === "industriale";
      const indiceDefault = ind ? t.indice_edificabilita_industriale_mq_mq : t.indice_edificabilita_default_mq_mq;
      const incidenza = ind ? t.incidenza_area_industriale : t.incidenza_area_su_valore_costruito;
      const indice = i.indice_edificabilita || indiceDefault;
      if (!i.indice_edificabilita)
        note.push(`Indice di edificabilità non presente nel file: ipotizzato ${indiceDefault} mq/mq. Verificare il PRG comunale: è il parametro che pesa di più sul valore.`);
      base = residenziale * (ind ? 0.45 : 1) * incidenza * indice;
      etichetta = `terreno ${ind ? "industriale" : "edificabile"} (indice ${indice} mq/mq)`;
    } else {
      base = D.mercato.agricolo[i.regione] ?? D.mercato.agricolo._default;
      etichetta = dest === "agricolo" ? "terreno agricolo" : "terreno (destinazione ignota)";
      if (dest !== "agricolo") note.push("Destinazione urbanistica non indicata: ipotizzato uso agricolo (ipotesi prudenziale).");
    }
  } else {
    base = residenziale * (D.mercato.ratio[i.tipologia] ?? D.mercato.ratio.altro);
    etichetta = i.tipologia;
  }

  const trend = prov ? (D.mercato.trend[prov] ?? D.mercato.trend._default) : D.mercato.trend._default;
  return { eurMq: base, min: base * 0.78, max: base * 1.28, serie: serieStorica(base, trend),
    trend, zona, affidabilita, note, fonte: `${D.mercato.fonte} — ${etichetta}` };
}

/* -------------------------------- valutazione -------------------------------- */

function categoriaPiano(piano) {
  const p = (piano || "").trim().toLowerCase();
  if (!p) return "intermedio";
  if (/attico|penthouse/.test(p)) return "attico";
  if (/seminterrato|interrato|s1|-1/.test(p)) return "seminterrato";
  if (p === "t" || p === "pt" || /terra|rialzato/.test(p)) return "terra";
  if (p.includes("ultimo")) return "ultimo";
  return "intermedio";
}

function calcola(i, ip, mesi) {
  const r = D.mercato.rettifiche, p = { avvisi: [], motivi: [] };
  const prezzoBase = i.prezzo_base || 0;
  p.mesi = mesi;

  p.pctAcquisto = percentualeAcquisto(i, ip);
  p.prezzoAcquisto = prezzoBase * p.pctAcquisto;
  const c = costiAcquisto(p.prezzoAcquisto, ip, prezzoBase);
  Object.assign(p, { intermediazione: c.intermediazione, registro: c.registro, fisse: c.fisse,
    notaio: c.notaio, agenziaAcquisto: c.agenzia, altriAcquisto: c.altri, costiAcquisto: c.totale });
  p.capex = capexRistrutturazione(i);
  p.cassaIniziale = p.prezzoAcquisto + p.costiAcquisto + p.capex;
  p.pctEsborso = prezzoBase > 0 ? (p.prezzoAcquisto + p.intermediazione) / prezzoBase : 0;

  const comp = comparabile(i);
  p.comp = comp;
  p.eurMq = comp.eurMq;
  let valoreLordo = comp.eurMq * (i.superficie_mq || 0);
  if (valoreLordo <= 0) {
    valoreLordo = i.prezzo_perizia || prezzoBase;
    p.avvisi.push("Superficie assente: valore di uscita stimato sul dato del file, non sui mq.");
  }
  p.valoreLordo = valoreLordo;

  const coef = {};
  if (eTerreno(i)) {
    coef.occupazione = r.stato_occupazione[i.stato_occupazione] ?? 1;
    coef.liquidita = r.liquidita_tipologia.terreno;
  } else {
    coef.conservazione = p.capex > 0 ? r.stato_conservazione.buono : (r.stato_conservazione[i.stato_conservazione] ?? 1);
    coef.occupazione = r.stato_occupazione[i.stato_occupazione] ?? 1;
    coef.piano = r.piano[categoriaPiano(i.piano)];
    coef.liquidita = r.liquidita_tipologia[i.tipologia] ?? r.liquidita_tipologia.altro;
  }
  const fattore = Object.values(coef).reduce((a, b) => a * b, 1);
  const u = ip.uscita;
  coef.trattativa = 1 - u.sconto_trattativa_pct;
  p.coef = coef;

  p.uscitaFile = prezzoBase * (1 - u.sconto_su_valore_file_pct) * (u.applica_rettifiche_al_metodo_file ? fattore : 1);
  p.uscitaMercato = valoreLordo * fattore * (1 - u.sconto_trattativa_pct);
  const metodo = u.metodo || "file";
  if (metodo === "mercato" || p.uscitaFile <= 0) { p.prezzoUscita = p.uscitaMercato; p.metodo = "mercato"; }
  else if (metodo === "prudenziale") { p.prezzoUscita = Math.min(p.uscitaFile, p.uscitaMercato); p.metodo = "prudenziale"; }
  else { p.prezzoUscita = p.uscitaFile; p.metodo = "file"; }

  p.agenziaVendita = p.prezzoUscita * u.commissione_agenzia_vendita_pct;
  p.costiUscita = u.spese_marketing_fisse + u.ape_e_pratiche_fisse;

  if (p.uscitaFile > 0 && p.uscitaMercato > 0) {
    const divario = p.uscitaMercato / p.uscitaFile;
    if (divario >= 1.6) p.avvisi.push(`I comparabili di zona valgono ${divario.toFixed(1)}x il prezzo da regola commerciale (${eur(p.uscitaMercato)} contro ${eur(p.uscitaFile)}): potrebbe esserci più margine di quanto stimato.`);
    else if (divario <= 0.65) p.avvisi.push(`I comparabili di zona valgono solo ${pct(divario)} del prezzo da regola commerciale (${eur(p.uscitaMercato)} contro ${eur(p.uscitaFile)}): il valore del file sembra fuori mercato.`);
  }
  comp.note.forEach((n) => p.avvisi.push(n));

  const imu = imuAnnua(i, p.valoreLordo);
  p.imu = imu.importo; p.imuMetodo = imu.metodo;
  p.oneriDettaglio = oneriAnnui(i, ip);
  p.oneri = Object.values(p.oneriDettaglio).reduce((a, b) => a + b, 0);

  const m = ip.mantenimento;
  let canone = i.canone_annuo || 0;
  if (canone <= 0 && i.stato_occupazione === "occupato" && p.valoreLordo > 0) {
    canone = p.valoreLordo * 0.035;
    p.avvisi.push("Canone non indicato: ipotizzato un rendimento lordo del 3,5%.");
  }
  if (i.stato_occupazione === "occupato_senza_titolo") canone = 0;
  p.locazione = canone * (1 - m.gestione_pct_su_canone - m.sfitto_pct_su_canone);
  p.gestioneAnnua = p.imu + p.oneri + p.cassaIniziale * m.costo_capitale_annuo_pct - p.locazione;
  p.gestionePeriodo = {};
  for (const mm of [...m.orizzonti_mesi, mesi]) p.gestionePeriodo["m" + mm] = p.gestioneAnnua * mm / 12;

  p.investimento = p.cassaIniziale + p.gestioneAnnua * mesi / 12;
  let incasso = p.prezzoUscita - p.agenziaVendita - p.costiUscita;
  p.tasse = 0;
  if (u.applica_tassazione_plusvalenza) {
    p.tasse = Math.max(0, incasso - p.cassaIniziale) * u.aliquota_plusvalenza_pct;
    incasso -= p.tasse;
  }
  p.incasso = incasso;
  p.utile = incasso - p.investimento;
  p.multiplo = p.investimento > 0 ? incasso / p.investimento : 0;
  p.roi = p.investimento > 0 ? p.utile / p.investimento : 0;
  const anni = Math.max(mesi / 12, 1 / 12);
  p.roiAnnuo = p.roi > -1 ? (1 + p.roi) ** (1 / anni) - 1 : -1;
  p.margine = incasso > 0 ? p.utile / incasso : 0;
  const den = 1 - u.commissione_agenzia_vendita_pct;
  p.pareggio = den > 0 ? (p.investimento + p.costiUscita) / den : 0;

  if (i.avvisiIngest) p.avvisi.push(...i.avvisiIngest);
  p.confidenza = confidenza(i, comp);
  semaforo(p, i, ip);
  return p;
}

function confidenza(i, comp) {
  let punti = 0;
  if (i.prezzo_base) punti += 0.28;
  if (i.superficie_mq) punti += 0.22;
  if (i.provincia) punti += 0.18;
  if (i.fab != null) punti += 0.10;
  if (i.stato_conservazione && i.stato_conservazione !== "sconosciuto") punti += 0.08;
  if (i.stato_occupazione && i.stato_occupazione !== "sconosciuto") punti += 0.06;
  punti += 0.08 * ({ alta: 1, media: 0.6, bassa: 0.25 }[comp.affidabilita] ?? 0.25);
  if (i.rendita_catastale) punti = Math.min(1, punti + 0.04);
  return Math.round(Math.min(1, punti) * 1000) / 1000;
}

function semaforo(p, i, ip) {
  const s = ip.soglie_semaforo, v = s.verde, g = s.giallo, motivi = [];
  const superaVerde = p.multiplo >= v.multiplo_min && p.roi >= v.roi_min && p.utile >= v.utile_min;
  const superaGiallo = p.multiplo >= g.multiplo_min && p.roi >= g.roi_min && p.utile >= g.utile_min;
  let stato;
  if (superaVerde) { stato = "verde"; motivi.push(`Multiplo ${num(p.multiplo, 2)}x e ROI ${pct(p.roi)} sopra le soglie di priorità.`); }
  else if (superaGiallo) { stato = "giallo"; motivi.push(`Multiplo ${num(p.multiplo, 2)}x: margine presente ma non prioritario.`); }
  else {
    stato = "rosso";
    motivi.push(p.utile <= 0 ? `Operazione in perdita: ${eur(p.utile)}.`
      : `Multiplo ${num(p.multiplo, 2)}x sotto la soglia minima (${num(g.multiplo_min, 2)}x).`);
  }
  if (i.stato_occupazione === "occupato_senza_titolo" && stato === "verde") { stato = "giallo"; motivi.push("Declassato: occupazione senza titolo, tempi e costi di rilascio incerti."); }
  if (i.stato_occupazione === "occupato" && stato === "verde") motivi.push("Immobile occupato: verificare scadenza contratto e prelazione del conduttore.");
  if (s.penalita_confidenza_bassa && p.confidenza < 0.5 && stato === "verde") { stato = "giallo"; motivi.push(`Declassato: dati incompleti (confidenza ${pct(p.confidenza)}), da verificare.`); }
  if (!i.prezzo_base) { stato = "rosso"; motivi.push("Nessun prezzo nel file: prospetto non calcolabile."); }
  p.stato = stato; p.motivi = motivi;
  p.punteggio = Math.round((
    (p.multiplo > 0 ? Math.min(p.multiplo / 2, 1) * 45 : 0) +
    Math.min(Math.max(p.roi, 0), 1) * 25 +
    Math.min(Math.max(p.utile, 0) / 150000, 1) * 20 +
    p.confidenza * 10) * 10) / 10;
}

const filtrate = () => {
  const f = S.filtri, cerca = f.testo.trim().toLowerCase();

    if (f.stato && p.stato !== f.stato) return false;

    if (f.prov && i.provincia !== f.prov) return false;
    if (f.occ && i.stato_occupazione !== f.occ) return false;
    if (f.cons && i.stato_conservazione !== f.cons) return false;
    if (f.mult && p.multiplo < f.mult) return false;
    if (cerca) {
      const t = [i.lotto, i.comune, i.provincia, i.indirizzo, i.tipologia, i.note].filter(Boolean).join(" ").toLowerCase();
      if (!t.includes(cerca)) return false;

/* -------------------- scaletta FAB: esborso contro rivendita -------------------- */

function disegnaScaletta() {
  const inter = S.ip.acquisto.intermediazione_pct || 0;
  const rivendita = 1 - S.ip.uscita.sconto_su_valore_file_pct;
  const scala = S.ip.fab.scala;
  const fabs = Object.keys(scala).map(Number).sort((a, b) => a - b);
  const dati = fabs.map((f) => ({ fab: f, esborso: scala[f] + inter }));
  const massimo = Math.max(rivendita, ...dati.map((d) => d.esborso)) * 1.18;

  const L = 36, R = 14, T = 26, B = 28, W = 420, H = 190;
  const gx = W - L - R, gy = H - T - B;
  const x = (n) => L + (gx / dati.length) * n;
  const larghezza = gx / dati.length - 5;
  const y = (v) => T + gy - (v / massimo) * gy;
  const colore = (e) => (e <= rivendita * 0.82 ? "var(--buono)" : e < rivendita ? "var(--medio)" : "var(--critico)");

  const barre = dati.map((d, n) => {
    const alt = Math.max(1, gy - (y(d.esborso) - T));
    return `<rect x="${x(n) + 2.5}" y="${y(d.esborso)}" width="${larghezza}" height="${alt}" rx="2"
              fill="${colore(d.esborso)}" data-fab="${d.fab}" data-esborso="${d.esborso}" tabindex="0"
              role="img" aria-label="FAB ${d.fab}: esborso ${pct(d.esborso)} del valore del file"></rect>
            <text x="${x(n) + 2.5 + larghezza / 2}" y="${y(d.esborso) - 4}" text-anchor="middle"
              font-size="8.5" font-family="var(--mono)" fill="var(--inchiostro-2)">${Math.round(d.esborso * 100)}</text>
            <text x="${x(n) + 2.5 + larghezza / 2}" y="${H - 9}" text-anchor="middle"
              font-size="9" font-family="var(--mono)" fill="var(--inchiostro-3)">${d.fab}</text>`;
  }).join("");

  const tacche = [0, 0.25, 0.5, 0.75].filter((v) => v < massimo).map((v) =>
    `<line x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}" stroke="var(--tratto-tenue)" stroke-width="1"></line>
     <text x="${L - 5}" y="${y(v) + 3}" text-anchor="end" font-size="8.5" font-family="var(--mono)" fill="var(--inchiostro-3)">${Math.round(v * 100)}%</text>`).join("");

  $("#scaletta").innerHTML = `
    <div class="testo">
      <div class="occhiello">Il vincolo strutturale</div>
      <h2>Fin dove regge la scala FAB</h2>
      <p>Ogni lotto costa <strong>la percentuale FAB più il ${pct(inter)} di intermediazione</strong>, e si rivende
      al <strong>${pct(rivendita)}</strong> del valore scritto nel file. Il margine è lo spazio fra la barra e la linea
      tratteggiata: dove la barra la supera, l'operazione è in perdita prima ancora di considerare notaio, imposte,
      ristrutturazione e mesi di gestione.</p>
      <p style="margin-top:7px">Il multiplo non può quindi superare <strong class="num">${num(rivendita / (scala[1] + inter), 2)}x</strong>
      (${pct(rivendita)} incassato su ${pct(scala[1] + inter)} investito, sul FAB più conveniente). Le soglie del
      semaforo sono tarate su questo tetto: il verde scatta a ${num(S.ip.soglie_semaforo.verde.multiplo_min, 2)}x.</p>
      <div class="legenda-regola"><i></i> Prezzo di rivendita: ${pct(rivendita)} del valore del file</div>
    </div>
    <div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Esborso per classe FAB confrontato con il prezzo di rivendita">
        <text x="${L}" y="9" font-size="8.5" font-family="var(--mono)" fill="var(--inchiostro-3)">% DEL VALORE A BASE D'ASTA</text>
        ${tacche}
        <line x1="${L}" y1="${y(rivendita)}" x2="${W - R}" y2="${y(rivendita)}"
          stroke="var(--critico)" stroke-width="2" stroke-dasharray="5 4"></line>
        <text x="${L}" y="${y(rivendita) - 6}" font-size="9" font-weight="600"
          font-family="var(--mono)" fill="var(--critico)">rivendita ${Math.round(rivendita * 100)}%</text>
        ${barre}
        <line x1="${L}" y1="${T + gy}" x2="${W - R}" y2="${T + gy}" stroke="var(--tratto)" stroke-width="1"></line>
        <text x="${W / 2}" y="${H - 1}" text-anchor="middle" font-size="8.5" fill="var(--inchiostro-3)">CLASSE FAB</text>
      </svg>
    </div>`;

  $("#scaletta").querySelectorAll("rect[data-fab]").forEach((rect) => {
    const mostra = (e) => {
      const esborso = +rect.dataset.esborso;
      const margine = rivendita - esborso;
      const s = $("#sugg");
      s.innerHTML = `<div class="t">FAB ${rect.dataset.fab}</div>
        <div class="v">Esborso ${pct(esborso)} · rivendita ${pct(rivendita)}</div>
        <div class="v" style="color:${margine > 0 ? "var(--buono-testo)" : "var(--critico-testo)"}">
          Margine lordo ${margine > 0 ? "+" : ""}${pct(margine)}</div>`;
      s.classList.remove("via");
      const r = (e.currentTarget || rect).getBoundingClientRect();
      s.style.left = Math.min(window.innerWidth - 260, r.left) + "px";
      s.style.top = Math.max(8, r.top - s.offsetHeight - 8) + "px";
    };
    rect.addEventListener("mouseenter", mostra);
    rect.addEventListener("focus", mostra);
    rect.addEventListener("mouseleave", () => $("#sugg").classList.add("via"));
    rect.addEventListener("blur", () => $("#sugg").classList.add("via"));
  });
}

function disegnaTabella() {
  const righe = [...filtrate()].sort((a, b) => {
    const { campo, cresc } = S.ordine, segno = cresc ? 1 : -1;
    const va = a.p[campo] ?? a.i[campo], vb = b.p[campo] ?? b.i[campo];
    if (typeof va === "string" || typeof vb === "string")
      return String(va ?? "").localeCompare(String(vb ?? ""), "it") * segno;
    return ((va ?? -Infinity) - (vb ?? -Infinity)) * segno;
  });

  $("#capi").innerHTML = COLONNE.map((c) => {
    const attiva = S.ordine.campo === c.c;
    return `<th class="${c.sx ? "sx" : ""}" data-c="${c.c}" scope="col" aria-sort="${attiva ? (S.ordine.cresc ? "ascending" : "descending") : "none"}">
      ${c.t} <span class="ord">${attiva ? (S.ordine.cresc ? "▲" : "▼") : ""}</span></th>`;
  }).join("");
  $("#capi").querySelectorAll("th").forEach((th) => th.addEventListener("click", () => {
    const c = th.dataset.c;
    S.ordine = S.ordine.campo === c ? { campo: c, cresc: !S.ordine.cresc } : { campo: c, cresc: false };
    disegnaTabella();
  }));

  $("#corpo").innerHTML = righe.map((r, n) =>
    `<tr class="${r.p.stato}" data-n="${S.righe.indexOf(r)}" tabindex="0">` +
    COLONNE.map((c) => `<td class="${c.sx ? "sx" : ""}">${c.v(r)}</td>`).join("") + "</tr>").join("");
  $("#corpo").querySelectorAll("tr").forEach((tr) => {
    const apri = () => apriFascicolo(+tr.dataset.n);
    tr.addEventListener("click", apri);
    tr.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); apri(); } });
  });

  const d = $("#deserto");
  if (!S.righe.length) {
    d.className = "deserto";
    d.innerHTML = `<h2>Nessun pool caricato</h2>
      <p>Carica un file Excel o CSV con l'elenco dei lotti: le colonne vengono riconosciute da sole.</p>
      <p><button class="btn primario" id="b-vuoto">Carica un file</button></p>`;
    $("#b-vuoto").addEventListener("click", () => $("#file").click());
  } else if (!righe.length) {
    d.className = "deserto";
    d.innerHTML = `<h2>Nessun lotto corrisponde ai filtri</h2><p>Allarga i criteri di ricerca.</p>`;
  } else d.className = "deserto via";
}

/* ------------------------------ lettura pool ------------------------------ */

const ALIAS_NOTI = new Set(Object.values(SINONIMI).flat());

function punteggioIntestazione(valori) {
  let p = 0;
  for (const v of valori) {
    const s = sfoglia(v);
    if (!s) continue;
    if (ALIAS_NOTI.has(s) || [...ALIAS_NOTI].some((a) => s.includes(a) || a.includes(s))) p++;
  }
  return p;
}

function trovaIntestazione(matrice) {
  let migliore = 0, meglio = -1;
  for (let n = 0; n < Math.min(15, matrice.length); n++) {
    const riga = matrice[n] || [];
    if (riga.filter((v) => String(v ?? "").trim()).length < 2) continue;
    const p = punteggioIntestazione(riga);
    if (p > meglio) { meglio = p; migliore = n; }
  }
  return meglio >= 2 ? migliore : 0;
}

function normalizzaFoglio(matrice, nomeFoglio) {
  const r = trovaIntestazione(matrice);
  const intestazioni = (matrice[r] || []).map((v, n) => String(v ?? "").trim() || `colonna_${n + 1}`);
  const mappa = rilevaColonne(intestazioni);
  const val = (riga, campo) => (mappa[campo] ? riga[intestazioni.indexOf(mappa[campo])] : null);
  const txt = (v) => { const s = String(v ?? "").trim(); return ["nan","none","n.d.","n/a","-"].includes(s.toLowerCase()) ? "" : s; };
  const out = [];

  for (const riga of matrice.slice(r + 1)) {
    if (!riga || !riga.some((v) => txt(v))) continue;
    const i = {
      lotto: txt(val(riga, "lotto")) || `riga ${out.length + 1}`,
      note: txt(val(riga, "note")),
      indirizzo: txt(val(riga, "indirizzo")),
      cap: txt(val(riga, "cap")),
      piano: txt(val(riga, "piano")),
      categoria_catastale: txt(val(riga, "categoria_catastale")).toUpperCase(),
      avvisiIngest: [],
      raw: Object.fromEntries(intestazioni.map((h, n) => [h, txt(riga[n])]).filter(([, v]) => v)),
    };
    i.fab = estraiFab(val(riga, "fab"), i.lotto, i.note) ?? estraiFab(...riga);
    i.tipologia = classificaTipo(val(riga, "tipologia"), i.categoria_catastale, i.note, i.lotto);
    i.stato_occupazione = classificaOcc(val(riga, "stato_occupazione"), i.note);
    i.stato_conservazione = classificaCons(val(riga, "stato_conservazione"), i.note);
    i.destinazione_terreno = classificaTerreno(val(riga, "destinazione_terreno"), val(riga, "tipologia"), i.note);
    Object.assign(i, risolviGeografia(txt(val(riga, "comune")), txt(val(riga, "provincia"))));
    for (const k of ["superficie_mq","rendita_catastale","canone_annuo","lat","lng","prezzo_base","prezzo_perizia","indice_edificabilita"])
      i[k] = numeroIt(val(riga, k));
    if (i.prezzo_base == null && i.prezzo_perizia != null) {
      i.prezzo_base = i.prezzo_perizia;
      i.avvisiIngest.push("Prezzo base assente: usato il valore di perizia.");
    }
    if (i.prezzo_base == null) i.avvisiIngest.push("Nessun prezzo rilevato nel file.");
    if (!i.superficie_mq && i.tipologia !== "terreno") i.avvisiIngest.push("Superficie assente: stime a mq non calcolabili.");
    if (!i.provincia) i.avvisiIngest.push("Provincia non riconosciuta: uso parametri nazionali medi.");
    if (i.fab == null) i.avvisiIngest.push("FAB non trovato: applicata la percentuale di default.");
    out.push(i);
  }
  const ignorate = intestazioni.filter((h) => !Object.values(mappa).includes(h));
  return { immobili: out, foglio: nomeFoglio, ignorate, utili: out.filter((i) => i.prezzo_base || i.superficie_mq).length };
}

async function caricaFile(file) {
  const buffer = await file.arrayBuffer();
  const libro = XLSX.read(buffer, { type: "array", cellDates: false, raw: false });
  const tutti = [], ignorate = new Set();
  for (const nome of libro.SheetNames) {
    const matrice = XLSX.utils.sheet_to_json(libro.Sheets[nome], { header: 1, blankrows: false, defval: null, raw: false });
    if (!matrice.length) continue;
    const esito = normalizzaFoglio(matrice, nome);
    if (esito.utili) { tutti.push(...esito.immobili); esito.ignorate.forEach((c) => ignorate.add(c)); }
  }
  if (!tutti.length) throw new Error("Nessun lotto riconosciuto: nel file non ho trovato colonne di prezzo o superficie.");
  return { immobili: tutti, ignorate: [...ignorate] };
}

let SALVATAGGIO = null;

async function esportaCsv() {
  const righe = filtrate();
  if (!righe.length) return avviso("Non c'è nulla da esportare con i filtri attuali.", "male");
  const capi = ["Lotto","FAB","Tipologia","Comune","Prov","Indirizzo","Superficie mq","Occupazione","Conservazione",
    "Valore da file","% acquisto","Prezzo acquisto","Intermediazione","% esborso","Imposta registro","Notaio",
    "Agenzia acquisto","Altri costi","Ristrutturazione","Cassa iniziale","IMU annua","Oneri annui",
    "Ricavo locazione","Gestione netta annua","EUR/mq 3 mesi","EUR/mq 6 mesi","EUR/mq 12 mesi",
    "Rivendita da file","Rivendita da comparabili","Metodo","Prezzo uscita","Agenzia vendita","Incasso netto",
    "Investimento","Utile","Multiplo","ROI","Prezzo di pareggio","Confidenza","Semaforo","Google Maps","Google Earth","Note"];
  const dec = (v) => (typeof v === "number" ? String(Math.round(v * 100) / 100).replace(".", ",") : v ?? "");
  const corpo = righe.map(({ i, p }) => {
    const l = linkMappe(i);
    return [i.lotto, i.fab, i.tipologia, i.comune, i.provincia, i.indirizzo, i.superficie_mq,
      i.stato_occupazione, i.stato_conservazione, i.prezzo_base, p.pctAcquisto, p.prezzoAcquisto,
      p.intermediazione, p.pctEsborso, p.registro, p.notaio, p.agenziaAcquisto, p.altriAcquisto, p.capex,
      p.cassaIniziale, p.imu, p.oneri, p.locazione, p.gestioneAnnua, p.comp.serie.m3, p.comp.serie.m6,
      p.comp.serie.m12, p.uscitaFile, p.uscitaMercato, p.metodo, p.prezzoUscita, p.agenziaVendita, p.incasso,
      p.investimento, p.utile, p.multiplo, p.roi, p.pareggio, p.confidenza, p.stato, l.maps, l.earth,
      [...p.motivi, ...p.avvisi].join(" | ")].map(dec);
  });
  const csv = "﻿" + [capi, ...corpo]
    .map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const nome = `prospetto_${S.mesi}mesi.csv`;

  // Nel visualizzatore il salvataggio passa dalla capability e il lettore conferma.
  if (SALVATAGGIO) {
    try {
      await SALVATAGGIO.save({ filename: nome, data: csv });
      avviso(`Esportati ${righe.length} lotti in CSV, apribile in Excel.`, "bene");
    } catch (err) {
      const codice = err?.code;
      if (codice === "declined") return;
      if (codice === "rate_limited") return avviso("C'è già un salvataggio in attesa: conferma quello e riprova.", "male");
      avviso("Non sono riuscito a salvare il file da questa pagina.", "male");
    }
    return;
  }

  // Fuori dal visualizzatore (pagina aperta in locale) vale il download diretto.
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  avviso(`Esportati ${righe.length} lotti in CSV, apribile in Excel.`, "bene");
}

/* --------------------------------- avvio --------------------------------- */

$("#b-carica").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const b = $("#b-carica");
  b.disabled = true; b.textContent = "Lettura…";
  try {
    const { immobili, ignorate } = await caricaFile(file);
    S.immobili = immobili; S.esempio = false; S.nomeFile = file.name;
    ricalcola();
    avviso(`Importati ${immobili.length} lotti da ${file.name}.` +
      (ignorate.length ? ` Colonne non riconosciute: ${ignorate.slice(0, 4).join(", ")}.` : ""), "bene");
  } catch (err) {
    avviso(err.message || "Non sono riuscito a leggere il file.", "male");
  } finally {
    b.disabled = false; b.textContent = "Carica pool"; e.target.value = "";
  }
});

$("#orizzonte").addEventListener("change", (e) => { S.mesi = +e.target.value; ricalcola(); });
$("#metodo").addEventListener("change", ricalcola);
$("#b-ipotesi").addEventListener("click", apriIpotesi);
$("#b-fonti").addEventListener("click", apriFonti);
$("#b-csv").addEventListener("click", () => { esportaCsv(); });
$("#velo").addEventListener("click", chiudi);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") chiudi(); });

for (const [sel, chiave] of Object.entries({ "#f-testo": "testo", "#f-tipo": "tipo", "#f-prov": "prov", "#f-occ": "occ", "#f-cons": "cons" }))
  $(sel).addEventListener("input", (e) => { S.filtri[chiave] = e.target.value; disegnaSintesi(); disegnaTabella(); });
$("#f-mult").addEventListener("input", (e) => { S.filtri.mult = parseFloat(e.target.value) || 0; disegnaSintesi(); disegnaTabella(); });
$("#b-azzera").addEventListener("click", () => {
  S.filtri = { testo: "", tipo: "", prov: "", occ: "", cons: "", stato: "", mult: 0 };
  document.querySelectorAll(".filtri input, .filtri select").forEach((el) => (el.value = ""));
  disegnaSintesi(); disegnaTabella();
});

// La capability di salvataggio arriva dopo il primo giro di script: fino ad allora
// il pulsante resta attivo e usa il download diretto.
if (window.claude?.use) {
  window.claude.use("downloads").then((d) => { SALVATAGGIO = d; }).catch(() => {});
}

S.immobili = D.esempio.map((r) => ({ ...r, avvisiIngest: ["Lotto del pool di esempio, non un tuo dato."], raw: { ...r } }));
$("#metodo").value = S.ip.uscita.metodo;
ricalcola();
</script>
